<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Click</title>
</head>
<body>
  <h1 id="heading">Welcome</h1>
  <button id="btn">Change text</button>
  <script>
    document.getElementById("btn").addEventListener("click", function () {
      document.getElementById("heading").textContent = "Button clicked";
    });
  </script>
</body>
</html>
